[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgv-gnn"
version = "0.1.0"
description = "Research prototype for uncertainty-aware TGV copper-plating additive screening"
requires-python = ">=3.10"
dependencies = [
  # Keep package metadata compatible with the current Streamlit Cloud stack.
  # Exact reproducibility pins remain in requirements.txt for local research.
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "pyyaml>=6.0.2,<7",
  "torch>=2.5,<3",
  "torch-geometric>=2.6.1,<3",
]

[project.optional-dependencies]
chemistry = ["rdkit>=2025.3.6,<2026"]
dft = ["ase>=3.23,<4"]
test = ["pytest==8.3.4", "ase>=3.23,<4"]
research = ["rdkit>=2025.3.6,<2026", "ase>=3.23,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
