seed: 42
optimizer: AdamW
learning_rate: 0.001
weight_decay: 0.0
loss: MAE
epochs: 200
batch_size: 16
scheduler: ReduceLROnPlateau
scheduler_patience: 5
scheduler_factor: 0.7
min_learning_rate: 1.0e-8
early_stopping_patience: 20
gradient_clip_norm: 5.0
cross_validation:
  outer_splits: 5
  inner_splits: 4
  group_key: parent_molecule_id
  stratify_key: chemical_family
  family_ood_protocol: LeaveOneGroupOut
scaling:
  fit_on: train_only
